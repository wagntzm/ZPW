            $(function(){

                generuj_japko()

            })

                
 

            function generuj_japko(){
                let $japko = $("#japko")

                $japko.css({
                    "margin-left":Math.floor((Math.random() * 500) + 1),
                    "margin-top":Math.floor((Math.random() * 500) + 1)
                
                
                })
            }


            
            $(document).on("keydown", function(event){
                if (event.key == "d") $("#kwadrat").css("margin-left", "+=10px")
                if (event.key == "a") $("#kwadrat").css("margin-left", "-=10px")
                if (event.key == "s") $("#kwadrat").css("margin-top",  "+=10px")
                if (event.key == "w") $("#kwadrat").css("margin-top",  "-=10px")

                let $kwadrat = $("#kwadrat")
                let $japko = $("#japko")

                let k = $kwadrat.offset()
                let j = $japko.offset()

                console.log(k.left, k.top, $kwadrat.outerWidth(), $kwadrat.outerHeight())
                console.log(j.left, j.top, $japko.outerWidth(), $japko.outerHeight())

                if (j.left < k.left + $kwadrat.outerWidth()  && j.left + $japko.outerWidth()  > k.left &&
                    j.top  < k.top  + $kwadrat.outerHeight() && j.top  + $japko.outerHeight() > k.top) {
                    // debug_licznik++;
                    // console.log(debug_licznik);
                    generuj_japko()
                }

            })

            
        </script>

            

        <style>
            #kwadrat {
                width: 200px;
                height: 200px;
                background-color: red;
                position: absolute;
            }

            #japko {
                width: 20px;
                height: 20px;
                background-color: green;
                position: absolute;
            }
 
    </style>
